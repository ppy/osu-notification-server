name: Compile

on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node.js
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: '26'

      - name: Install js dependencies
        run: npm ci --omit=dev

      - run: npm run build
